CLaserOdometry2DNode:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    publish_tf: true
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ""
    # Poll faster than the ~10 Hz scan source; RF2O still processes each scan
    # only once, but does not add avoidable latency before publishing odometry.
    freq: 20.0
